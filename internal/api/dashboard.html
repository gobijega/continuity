<style>
  :root{
    --bg:#0A1730; --panel:#12294C; --panel2:#0E2144; --hair:#24406B;
    --white:#FFFFFF; --sec:#AAB8D0; --muted:#70819E;
    --cyan:#35C6E0; --green:#2FD08A; --amber:#F6B23C; --red:#F26D6D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--white);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    padding:26px 30px 30px;min-height:100vh}
  .serif{font-family:Georgia,'Times New Roman',serif}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .logo{width:34px;height:34px;border-radius:50%;background:var(--cyan);display:flex;align-items:center;justify-content:center}
  .logo span{width:13px;height:13px;border:2.5px solid var(--bg);border-radius:50%}
  .brand{font-size:19px;font-weight:700;letter-spacing:3px}
  .sub{color:var(--sec);font-size:12.5px;letter-spacing:1px;margin:2px 0 20px 48px}

  .topbar{display:flex;gap:16px;align-items:stretch;margin-bottom:18px;flex-wrap:wrap}
  .status{flex:1;min-width:280px;border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:16px}
  .status .dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
  .status .lab{font-size:11px;letter-spacing:2px;opacity:.85}
  .status .val{font-size:26px;font-weight:800}
  .active{min-width:220px;background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:16px 20px}
  .active .lab{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:700}
  .active .val{font-size:26px;font-weight:800;margin-top:4px}
  .active .meta{color:var(--muted);font-size:12px;margin-top:2px}

  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .controls button{background:var(--panel);color:var(--white);border:1px solid var(--hair);
    border-radius:9px;padding:10px 14px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.4px}
  .controls button:hover{border-color:var(--cyan)}
  .controls button.warn:hover{border-color:var(--amber)}
  .controls button.bad:hover{border-color:var(--red)}
  .controls button.good:hover{border-color:var(--green)}
  .controls .spacer{flex:1}

  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
  .cards{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:16px 18px;
    display:grid;grid-template-columns:1.3fr auto auto auto auto;gap:14px;align-items:center}
  .card.act{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
  .b-name{font-size:20px;font-weight:800}
  .b-kind{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
  .b-score{font-size:34px;font-weight:800;line-height:1;text-align:center}
  .b-score small{display:block;font-size:9px;color:var(--muted);letter-spacing:2px;font-weight:700;margin-top:4px}
  .metric{text-align:center}
  .metric b{font-size:15px;font-weight:700}
  .metric small{display:block;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:3px}
  .role{justify-self:end;font-size:10px;font-weight:800;letter-spacing:1px;padding:5px 10px;border-radius:20px;color:var(--bg)}
  .bar{grid-column:1 / -1;height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:2px}
  .bar > i{display:block;height:100%;border-radius:4px}

  .timeline{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:16px 18px;min-height:300px}
  .timeline h3{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:700;margin-bottom:12px}
  .ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .ev:last-child{border-bottom:none}
  .ev .tdot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
  .ev .ttime{color:var(--muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;width:64px}
  .ev .ttxt{font-size:12.5px}
  .ev .ttxt b{font-weight:700}
  .foot{color:var(--muted);font-size:11px;margin-top:18px;letter-spacing:.4px}

  /* Scripted-demo narrative banner (Sprint 10) */
  .demobar{background:linear-gradient(90deg,var(--panel),var(--panel2));border:1px solid var(--hair);
    border-left:3px solid var(--green);border-radius:12px;padding:13px 18px;margin-bottom:16px}
  .demo-cap{font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;line-height:1.35}
  .demo-badge{background:var(--green);color:var(--bg);font-size:10px;font-weight:800;letter-spacing:1.5px;
    padding:3px 8px;border-radius:5px;flex:none}
  .demo-prog{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:10px}
  .demo-prog > i{display:block;height:100%;background:var(--green);width:0;transition:width .5s linear}
  .demo-meta{color:var(--muted);font-size:11px;margin-top:7px;letter-spacing:.4px;font-variant-numeric:tabular-nums}

  /* Session-continuity tile */
  .cont .lab{color:var(--green)}
  .cont .val{font-size:20px;font-variant-numeric:tabular-nums}
</style>
</head>

    <button class="warn" onclick="sim('5g','degrade')">Degrade 5G</button>
    <button class="bad" onclick="sim('satcom','outage')">SATCOM outage</button>
    <button class="warn" onclick="sim('wifi','degrade')">Wi-Fi packet loss</button>
    <span class="spacer"></span>
    <button class="good" onclick="sim('all','restore')">Restore all</button>
  </div>

  <div class="grid">
    <div class="cards" id="cards"></div>
    <div class="timeline">
      <h3>EVENT TIMELINE</h3>
      <div id="events"></div>
    </div>
  </div>

  <div class="foot" id="foot">JEGASEC Continuity — Edge Agent · autonomous multi-bearer resilience</div>

<script>
const C={green:'#2FD08A',amber:'#F6B23C',red:'#F26D6D',cyan:'#35C6E0',muted:'#70819E',sec:'#AAB8D0'};
function scoreColor(s){ if(s>=70) return C.green; if(s>=40) return C.amber; return C.red; }
function statusColor(s){ return s==='RESILIENT'?C.green : s==='DEGRADED'?C.amber : C.red; }
function evColor(t){ return {MIGRATE:C.cyan,REBIND:C.green,DEGRADED:C.amber,LINK_DOWN:C.red,HEALTHY:C.green}[t]||C.muted; }
function hhmmss(iso){ try{const d=new Date(iso);return d.toTimeString().slice(0,8);}catch(e){return '';} }
function esc(x){ return (x==null?'':String(x)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function sim(name,action){
  try{ await fetch(`/api/v1/simulator/${name}/${action}`,{method:'POST'}); }catch(e){}
  setTimeout(refresh,150);
}

function render(st){
  document.getElementById('sub').textContent = `node ${st.node} · profile ${st.profile}`;
  const sv=statusColor(st.status);
  const sb=document.getElementById('status');
  sb.style.background = sv+'22'; sb.style.border='1px solid '+sv;
  const sd=document.getElementById('statusDot'); sd.style.background=sv; sd.style.color=st.status==='DEGRADED'?'#0A1730':'#0A1730';
  document.getElementById('statusVal').textContent = st.status;
  document.getElementById('statusVal').style.color = sv;

  const act=(st.bearers||[]).find(b=>b.name===st.active_interface);
  document.getElementById('activeVal').textContent = (st.active_interface||'—').toUpperCase();
  document.getElementById('activeMeta').textContent = act? `${Math.round(act.metrics.latency_ms)} ms · ${act.metrics.loss_pct.toFixed(1)}% loss` : '';

  // Session-continuity overlay tile (Sprint 9).
  const c=st.continuity, ct=document.getElementById('contTile');
  if(c && c.enabled){
    ct.style.display='block';
    document.getElementById('contOverlay').textContent = c.overlay;
    document.getElementById('contMeta').innerHTML =
      `via <b style="color:${C.sec}">${esc((c.endpoint||'—').toUpperCase())}</b> · ${esc(c.cipher)} · ${c.rebinds} rebind${c.rebinds===1?'':'s'}`;
  } else { ct.style.display='none'; }

  // Scripted-demo narrative banner (Sprint 10).
  const dm=st.demo, db=document.getElementById('demobar');
  const demoOn = !!(dm && dm.running);
  if(demoOn){
    db.style.display='block';
    document.getElementById('demoCap').textContent = dm.caption||'';
    const pct = dm.total_s ? Math.max(0,Math.min(100, dm.elapsed_s/dm.total_s*100)) : 0;
    document.getElementById('demoProg').style.width = pct+'%';
    document.getElementById('demoMeta').textContent =
      `beat ${dm.step}/${dm.steps} · ${Math.round(dm.elapsed_s)}s / ${Math.round(dm.total_s)}s · cycle ${(dm.loops||0)+1}`;
  } else { db.style.display='none'; }

  // Manual controls: shown in sim mode, hidden while the scripted demo drives.
  document.getElementById('controls').style.display = (st.sim && !demoOn) ? 'flex' : 'none';

  const cards=document.getElementById('cards'); cards.innerHTML='';
  (st.bearers||[]).forEach(b=>{
    const sc=scoreColor(b.score), ok=b.metrics.ok;
    const roleBg = b.role==='ACTIVE'?C.green : b.role==='DOWN'?C.red : '#24406B';
    const roleFg = b.role==='STANDBY'?C.sec:'#0A1730';
    const el=document.createElement('div');
    el.className='card'+(b.role==='ACTIVE'?' act':'');
    el.innerHTML=`
      <div><div class="b-name">${esc(b.name.toUpperCase())}</div><div class="b-kind">${esc(b.kind)}</div></div>
      <div class="b-score" style="color:${sc}">${b.score.toFixed(0)}<small>SCORE</small></div>
      <div class="metric"><b>${ok?Math.round(b.metrics.latency_ms):'—'}</b><small>LAT ms</small></div>
      <div class="metric"><b>${ok?b.metrics.loss_pct.toFixed(0)+'%':'—'}</b><small>LOSS</small></div>
      <div class="role" style="background:${roleBg};color:${roleFg}">${esc(b.role)}</div>
      <div class="bar"><i style="width:${Math.max(3,Math.min(100,b.score))}%;background:${sc}"></i></div>`;
    cards.appendChild(el);
  });

  const evs=document.getElementById('events'); evs.innerHTML='';
  (st.events||[]).forEach(e=>{
    const el=document.createElement('div'); el.className='ev';
    const flow = (e.type==='MIGRATE'||e.type==='REBIND');
    const txt = flow
      ? `<b style="color:${e.type==='REBIND'?C.green:C.cyan}">${esc((e.from||'').toUpperCase())} → ${esc((e.to||'').toUpperCase())}</b> — ${esc(e.reason)}`
      : `<b>${esc((e.interface||'').toUpperCase())}</b> ${esc(e.type.replace('_',' ').toLowerCase())} — ${esc(e.reason)}`;
    el.innerHTML=`<div class="tdot" style="background:${evColor(e.type)}"></div>
      <div class="ttime">${hhmmss(e.at)}</div><div class="ttxt">${txt}</div>`;
    evs.appendChild(el);
  });
  if(!(st.events||[]).length){ evs.innerHTML=`<div style="color:${C.muted};font-size:12px">No events yet — trigger a degrade to see failover.</div>`; }
}

async function refresh(){
  try{ const r=await fetch('/api/v1/state',{cache:'no-store'}); render(await r.json()); }catch(e){}
}
refresh();
setInterval(refresh,1000);
</script>
</body>
</html>
