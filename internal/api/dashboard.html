<style>
  :root{
    --bg:#06080c; --bg-alt:#0a0e15; --panel:#0e131c; --panel2:#131a26;
    --border:#1f2937; --border-bright:#2a3648;
    --text:#e6ebf3; --muted:#8a97ab;
    --accent:#00ff41; --accent-dim:rgba(0,255,65,.12);
    --amber:#ffb020; --red:#ff4d4d;
    --radius:2px;
    --display:'Chakra Petch','Share Tech Mono',ui-monospace,monospace;
    --mono:'IBM Plex Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);
    padding:30px 32px 34px;min-height:100vh;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0 0 auto 0;height:2px;background:var(--accent);
    box-shadow:0 0 14px rgba(0,255,65,.55);z-index:60}
  .serif{font-family:var(--display)}

  .head{display:flex;align-items:center;gap:14px;margin-bottom:2px}
  .logo{width:40px;height:40px;flex:none}
  .wordmark{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:.13em;color:var(--text);line-height:1}
  .wordmark .prod{color:var(--accent);text-shadow:0 0 14px rgba(0,255,65,.45)}
  .sub{font-family:var(--mono);color:var(--muted);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    margin:11px 0 22px 54px;display:flex;align-items:center;gap:9px}
  .sub::before{content:"";width:16px;height:1px;background:var(--accent);box-shadow:0 0 8px var(--accent);flex:none}

  .topbar{display:flex;gap:14px;align-items:stretch;margin-bottom:16px;flex-wrap:wrap}
  .status,.active{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px}
  .status{flex:1;min-width:290px;display:flex;align-items:center;gap:16px}
  .status .dot{width:15px;height:15px;border-radius:50%;flex:none;font-size:0;overflow:hidden}
  .lab{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .status .val{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:.05em;line-height:1.1;margin-top:3px}
  .active{min-width:210px}
  .active .lab{color:var(--accent)}
  .active .val{font-family:var(--display);font-size:23px;font-weight:600;margin-top:6px;letter-spacing:.05em}
  .active .meta{font-family:var(--mono);color:var(--muted);font-size:11px;margin-top:5px}
  .cont .lab{color:var(--accent)}
  .cont .val{font-family:var(--display);font-size:19px;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .cont .meta{font-family:var(--mono);color:var(--muted);font-size:11px;margin-top:5px}

  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .controls button{background:transparent;color:var(--text);border:1px solid var(--border-bright);
    border-radius:var(--radius);padding:11px 16px;font-family:var(--display);font-size:12px;font-weight:500;
    text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:border-color .15s,color .15s}
  .controls button:hover{border-color:var(--accent);color:var(--accent)}
  .controls button.warn:hover{border-color:var(--amber);color:var(--amber)}
  .controls button.bad:hover{border-color:var(--red);color:var(--red)}
  .controls button.good:hover{border-color:var(--accent);color:var(--accent)}
  .controls .spacer{flex:1}

  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
  .cards{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 18px;
    display:grid;grid-template-columns:1.3fr auto auto auto auto;gap:14px;align-items:center;position:relative}
  .card.act{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-dim),0 0 20px rgba(0,255,65,.09)}
  .card.act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .b-name{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.05em}
  .b-kind{font-family:var(--mono);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.16em;margin-top:3px}
  .b-score{font-family:var(--display);font-size:31px;font-weight:600;line-height:1;text-align:center}
  .b-score small{display:block;font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.16em;font-weight:400;margin-top:5px}
  .metric{text-align:center}
  .metric b{font-family:var(--mono);font-size:15px;font-weight:600}
  .metric small{display:block;font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.1em;margin-top:4px}
  .role{justify-self:end;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;
    padding:5px 11px;border-radius:var(--radius);border:1px solid transparent}
  .bar{grid-column:1 / -1;height:4px;background:var(--bg-alt);overflow:hidden;margin-top:2px}
  .bar > i{display:block;height:100%}

  .timeline{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;min-height:300px}
  .timeline h3{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--accent);font-weight:600;
    text-transform:uppercase;margin-bottom:6px;padding-bottom:11px;border-bottom:1px solid var(--border)}
  .ev{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--border)}
  .ev:last-child{border-bottom:none}
  .ev .tdot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
  .ev .ttime{font-family:var(--mono);color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums;flex:none;width:62px}
  .ev .ttxt{font-family:var(--mono);font-size:12px;line-height:1.5}
  .ev .ttxt b{font-weight:600}
  .foot{font-family:var(--mono);color:var(--muted);font-size:10px;margin-top:20px;letter-spacing:.1em;
    text-transform:uppercase;padding-top:14px;border-top:1px solid var(--border)}

  /* Scripted-demo narrative banner (Sprint 10) */
  .demobar{background:var(--panel);border:1px solid var(--border);border-left:2px solid var(--accent);
    border-radius:var(--radius);padding:13px 18px;margin-bottom:16px}
  .demo-cap{font-family:var(--mono);font-size:13px;display:flex;align-items:center;gap:12px;line-height:1.45;color:var(--text)}
  .demo-badge{background:var(--accent);color:var(--bg);font-family:var(--display);font-size:10px;font-weight:600;
    letter-spacing:.16em;padding:3px 9px;border-radius:var(--radius);flex:none}
  .demo-prog{height:4px;background:var(--bg-alt);overflow:hidden;margin-top:11px}
  .demo-prog > i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s linear;box-shadow:0 0 10px rgba(0,255,65,.6)}
  .demo-meta{font-family:var(--mono);color:var(--muted);font-size:10.5px;margin-top:8px;letter-spacing:.06em;font-variant-numeric:tabular-nums}

  @media (max-width:820px){ .grid{grid-template-columns:1fr} }
</style>
</head>

  </div>
  <div class="sub" id="sub">edge resilience console</div>

  <div class="demobar" id="demobar" style="display:none">
    <div class="demo-cap"><span class="demo-badge">DEMO</span><span id="demoCap"></span></div>
    <div class="demo-prog"><i id="demoProg"></i></div>
    <div class="demo-meta" id="demoMeta"></div>
  </div>

  <div class="topbar">
    <div class="status" id="status">
      <div class="dot" id="statusDot">●</div>
      <div><div class="lab">SYSTEM STATUS</div><div class="val serif" id="statusVal">—</div></div>
    </div>
    <div class="active">
      <div class="lab">ACTIVE PATH</div>
      <div class="val serif" id="activeVal">—</div>
      <div class="meta" id="activeMeta"></div>
    </div>
    <div class="active cont" id="contTile" style="display:none">
      <div class="lab">SESSION CONTINUITY</div>
      <div class="val serif" id="contOverlay">—</div>
      <div class="meta" id="contMeta"></div>
    </div>
  </div>

  <div class="controls" id="controls" style="display:none">
    <button class="warn" onclick="sim('5g','degrade')">Degrade 5G</button>
    <button class="bad" onclick="sim('satcom','outage')">SATCOM outage</button>
    <button class="warn" onclick="sim('wifi','degrade')">Wi-Fi packet loss</button>
    <span class="spacer"></span>
    <button class="good" onclick="sim('all','restore')">Restore all</button>
  </div>

  <div class="grid">
    <div class="cards" id="cards"></div>
    <div class="timeline">
      <h3>EVENT TIMELINE</h3>
      <div id="events"></div>
    </div>
  </div>

  <div class="foot" id="foot">JEGASEC Continuity — Edge Agent · autonomous multi-bearer resilience</div>

<script>
const C={green:'#00ff41',amber:'#ffb020',red:'#ff4d4d',muted:'#8a97ab',text:'#e6ebf3',bg:'#06080c',border:'#2a3648'};
function scoreColor(s){ if(s>=70) return C.green; if(s>=40) return C.amber; return C.red; }
function statusColor(s){ return s==='RESILIENT'?C.green : s==='DEGRADED'?C.amber : C.red; }
function evColor(t){ return {MIGRATE:C.green,REBIND:C.green,DEGRADED:C.amber,LINK_DOWN:C.red,HEALTHY:C.green}[t]||C.muted; }
function hhmmss(iso){ try{const d=new Date(iso);return d.toTimeString().slice(0,8);}catch(e){return '';} }
function esc(x){ return (x==null?'':String(x)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function sim(name,action){
  try{ await fetch(`/api/v1/simulator/${name}/${action}`,{method:'POST'}); }catch(e){}
  setTimeout(refresh,150);
}

function render(st){
  document.getElementById('sub').textContent = `node ${st.node} · profile ${st.profile}`;
  const sv=statusColor(st.status);
  const sb=document.getElementById('status');
  sb.style.background = sv+'22'; sb.style.border='1px solid '+sv;
  const sd=document.getElementById('statusDot'); sd.style.background=sv; sd.style.boxShadow='0 0 14px '+sv;
  document.getElementById('statusVal').textContent = st.status;
  document.getElementById('statusVal').style.color = sv;

  const act=(st.bearers||[]).find(b=>b.name===st.active_interface);
  document.getElementById('activeVal').textContent = (st.active_interface||'—').toUpperCase();
  document.getElementById('activeMeta').textContent = act? `${Math.round(act.metrics.latency_ms)} ms · ${act.metrics.loss_pct.toFixed(1)}% loss` : '';

  // Session-continuity overlay tile (Sprint 9).
  const c=st.continuity, ct=document.getElementById('contTile');
  if(c && c.enabled){
    ct.style.display='block';
    document.getElementById('contOverlay').textContent = c.overlay;
    document.getElementById('contMeta').innerHTML =
      `via <b style="color:${C.green}">${esc((c.endpoint||'—').toUpperCase())}</b> · ${esc(c.cipher)} · ${c.rebinds} rebind${c.rebinds===1?'':'s'}`;
  } else { ct.style.display='none'; }

  // Scripted-demo narrative banner (Sprint 10).
  const dm=st.demo, db=document.getElementById('demobar');
  const demoOn = !!(dm && dm.running);
  if(demoOn){
    db.style.display='block';
    document.getElementById('demoCap').textContent = dm.caption||'';
    const pct = dm.total_s ? Math.max(0,Math.min(100, dm.elapsed_s/dm.total_s*100)) : 0;
    document.getElementById('demoProg').style.width = pct+'%';
    document.getElementById('demoMeta').textContent =
      `beat ${dm.step}/${dm.steps} · ${Math.round(dm.elapsed_s)}s / ${Math.round(dm.total_s)}s · cycle ${(dm.loops||0)+1}`;
  } else { db.style.display='none'; }

  // Manual controls: shown in sim mode, hidden while the scripted demo drives.
  document.getElementById('controls').style.display = (st.sim && !demoOn) ? 'flex' : 'none';

  const cards=document.getElementById('cards'); cards.innerHTML='';
  (st.bearers||[]).forEach(b=>{
    const sc=scoreColor(b.score), ok=b.metrics.ok;
    let roleStyle;
    if(b.role==='ACTIVE') roleStyle=`background:${C.green};color:${C.bg};border-color:${C.green}`;
    else if(b.role==='DOWN') roleStyle=`background:transparent;color:${C.red};border-color:${C.red}`;
    else roleStyle=`background:transparent;color:${C.muted};border-color:${C.border}`;
    const el=document.createElement('div');
    el.className='card'+(b.role==='ACTIVE'?' act':'');
    el.innerHTML=`
      <div><div class="b-name">${esc(b.name.toUpperCase())}</div><div class="b-kind">${esc(b.kind)}</div></div>
      <div class="b-score" style="color:${sc}">${b.score.toFixed(0)}<small>SCORE</small></div>
      <div class="metric"><b>${ok?Math.round(b.metrics.latency_ms):'—'}</b><small>LAT ms</small></div>
      <div class="metric"><b>${ok?b.metrics.loss_pct.toFixed(0)+'%':'—'}</b><small>LOSS</small></div>
      <div class="role" style="${roleStyle}">${esc(b.role)}</div>
      <div class="bar"><i style="width:${Math.max(3,Math.min(100,b.score))}%;background:${sc};box-shadow:0 0 8px ${sc}66"></i></div>`;
    cards.appendChild(el);
  });

  const evs=document.getElementById('events'); evs.innerHTML='';
  (st.events||[]).forEach(e=>{
    const el=document.createElement('div'); el.className='ev';
    const col=evColor(e.type);
    const flow = (e.type==='MIGRATE'||e.type==='REBIND');
    const txt = flow
      ? `<b style="color:${col}">${esc((e.from||'').toUpperCase())} → ${esc((e.to||'').toUpperCase())}</b> — ${esc(e.reason)}`
      : `<b>${esc((e.interface||'').toUpperCase())}</b> ${esc(e.type.replace('_',' ').toLowerCase())} — ${esc(e.reason)}`;
    el.innerHTML=`<div class="tdot" style="background:${col};box-shadow:0 0 8px ${col}88"></div>
      <div class="ttime">${hhmmss(e.at)}</div><div class="ttxt">${txt}</div>`;
    evs.appendChild(el);
  });
  if(!(st.events||[]).length){ evs.innerHTML=`<div style="color:${C.muted};font-family:var(--mono);font-size:12px">// no events yet — trigger a degrade to see failover</div>`; }
}

async function refresh(){
  try{ const r=await fetch('/api/v1/state',{cache:'no-store'}); render(await r.json()); }catch(e){}
}
refresh();
setInterval(refresh,1000);
</script>
</body>
</html>
